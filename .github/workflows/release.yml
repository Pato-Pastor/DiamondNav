name: Release

# Push a tag vX.Y.Z (matching CMakeLists.txt's VERSION) to publish a release with
# the Linux and Windows archives.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches the version
        run: |
          want="v$(sed -nE 's/^project\(DiamondNav.*VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)"
          [ "$want" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME, CMakeLists.txt says $want"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "DiamondNav $GITHUB_REF_NAME" --generate-notes
