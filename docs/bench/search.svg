</style><text class="t" x="0" y="18">How long one path search takes</text><text class="s" x="0" y="38">On a search thread, off the main thread. Bar: average of 1,000 searches; mark: 95th percentile</text><text x="98.39999999999999" y="72.0" text-anchor="end">Walk 50-200 m</text><rect x="106.39999999999999" y="56" width="27.0" height="24" rx="4" fill="#2a78d6"/><line x1="215.4" x2="215.4" y1="53" y2="83" stroke="currentColor" class="a" style="stroke-width:2"/><text x="223.4" y="72.0">0.23 ms (95%: 0.94)</text><text x="98.39999999999999" y="106.0" text-anchor="end">Walk 300-800 m</text><rect x="106.39999999999999" y="90" width="126.4" height="24" rx="4" fill="#2a78d6"/><line x1="486.0" x2="486.0" y1="87" y2="117" stroke="currentColor" class="a" style="stroke-width:2"/><text x="494.0" y="106.0">1.09 ms (95%: 3.26)</text><text x="98.39999999999999" y="140.0" text-anchor="end">Walk 1.5-3 km</text><rect x="106.39999999999999" y="124" width="368.6" height="24" rx="4" fill="#2a78d6"/><line x1="618.6" x2="618.6" y1="121" y2="151" stroke="currentColor" class="a" style="stroke-width:2"/><text x="626.6" y="140.0">3.17 ms (95%: 4.40)</text><text x="98.39999999999999" y="174.0" text-anchor="end">Road 300-800 m</text><rect x="106.39999999999999" y="158" width="20.0" height="24" rx="4" fill="#eb6834"/><line x1="168.8" x2="168.8" y1="155" y2="185" stroke="currentColor" class="a" style="stroke-width:2"/><text x="176.8" y="174.0">0.17 ms (95%: 0.54)</text><text x="98.39999999999999" y="208.0" text-anchor="end">Road 2-6 km</text><rect x="106.39999999999999" y="192" width="63.9" height="24" rx="4" fill="#eb6834"/><line x1="267.1" x2="267.1" y1="189" y2="219" stroke="currentColor" class="a" style="stroke-width:2"/><text x="275.1" y="208.0">0.55 ms (95%: 1.38)</text></svg>